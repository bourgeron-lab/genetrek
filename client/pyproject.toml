[project]
name = "genetrek"
version = "0.1.0.dev0"
description = "Python client and command line for GeneTrek: gene lists and annotations for neurodevelopmental disorders."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Human Genetics and Cognitive Functions, Institut Pasteur", email = "ghfcgenetics@pasteur.fr" },
]
keywords = ["genomics", "neurodevelopmental disorders", "autism", "gene lists", "api client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.27",
    "polars>=0.20.0",
    "typer>=0.12.0",
    "platformdirs>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14"]

[project.scripts]
genetrek = "genetrek.cli:main"

[project.urls]
Homepage = "https://genetrek.pasteur.fr"
Documentation = "https://genetrek.pasteur.fr/api-reference"
Repository = "https://github.com/bourgeron-lab/genetrek"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetrek"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py310"

[tool.ruff.lint]
# Raised only for a py310 target: exceptions are zero-cost from 3.11, and the
# loop that skips a damaged stored list is clearer as written.
extend-ignore = ["PERF203"]

[tool.ruff.lint.per-file-ignores]
# Typer reads each option from a boolean parameter's default.
"src/genetrek/cli.py" = ["FBT001", "FBT002"]
"tests/*.py" = ["S101", "ANN001", "ANN201", "ANN202", "PLR2004", "INP001"]
