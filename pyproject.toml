[project]
name = "genetrek"
version = "2.0.0"
description = "GeneTrek: curated gene lists and gene annotations for neurodevelopmental disorders, to search, compare and download."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENCES.md"]
authors = [
    { name = "Human Genetics and Cognitive Functions, Institut Pasteur", email = "ghfcgenetics@pasteur.fr" },
]
keywords = ["genomics", "neurodevelopmental disorders", "autism", "epilepsy", "intellectual disability", "gene lists"]
dependencies = [
    "polars>=0.20.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.0",
    "nicegui>=1.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.28.1",
    "xlsxwriter>=3.2.9",
]

[project.urls]
Homepage = "https://genetrek.pasteur.fr"
Documentation = "https://genetrek.pasteur.fr/documentation"
Repository = "https://github.com/bourgeron-lab/genetrek"
Changelog = "https://genetrek.pasteur.fr/changelog"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetrek"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0.20240106",
    "pytest>=8.0.0",
]
# notebooks/brain_data: polars.read_excel needs fastexcel; nbconvert runs the
# notebooks headless.
notebooks = [
    "fastexcel>=0.12.0",
    "nbconvert>=7.16.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    "notebooks",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # Pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # NumPy-specific rules
    "AIR",  # Airflow
    "PERF", # Perflint
]
ignore = [
    # The formatter owns trailing commas; keeping COM812 selected makes `ruff
    # check` and `ruff format` undo each other. Ruff warns about this pairing.
    "COM812",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# UI composition modules: accept higher complexity and boolean params
"src/genetrek/ui/*.py" = ["PLR0915", "FBT001", "FBT002", "ANN202", "PLR0912", "PLR0913"]
"src/genetrek/ui/components/*.py" = ["PLR0915", "FBT001", "FBT002", "ANN202", "PLR0912", "PLR0913"]
# CLI modules: Typer reads annotations at runtime via get_type_hints, so
# TC003 would break it; the rest are Typer's Option/Argument idioms
"src/genetrek/cli/*.py" = [
    "FBT001",
    "FBT002",
    "PLR0913",
    "B008",
    "TRY300",
    "TC003",
    "ANN401",
]
# HTTP API: a query parameter is genuinely a bare `?drop_empty=true` on the
# wire, so FBT reads FastAPI's idiom as a boolean trap; endpoints take many
# such parameters, and a cell value really is of arbitrary type
# PLR0915 for the same reason ui/ has it: one function registers every
# endpoint as a closure over the config, which is the pattern create_router
# already uses -- threading the config through module-level handlers instead
# would trade a long function for a wider surface
"src/genetrek/api/*.py" = [
    "FBT001",
    "FBT002",
    "PLR0913",
    "PLR0915",
    "ANN401",
]
# Database mutation API: add_field/save deliberately take many keyword-only
# options, and metadata values are genuinely of arbitrary type
"src/genetrek/db/database.py" = ["PLR0913", "ANN401"]
# The coordinate cascade is configured, not overloaded: every extra argument
# past the first two is keyword-only (column names, fallback, provenance)
"src/genetrek/db/sources/coordinates.py" = ["PLR0913"]
# The build passes one context bundle (plan, release, report) down to each
# metadata factory rather than reassembling it per column
"src/genetrek/db/build.py" = ["PLR0913"]
# Atomicity needs os.replace's exact semantics, not Path.replace's wrapper
"src/genetrek/db/storage.py" = ["PTH105"]
# Tests: asserts, magic values, and untyped fixtures are idiomatic; pytest
# discovers tests/ by rootdir, so no __init__.py (INP001)
"tests/*.py" = [
    "S101",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN401",
    "PLR2004",
    "PLR0913",
    "INP001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["polars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nicegui.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

# pyarrow is an optional extra, only imported by `genetrek-db list --on-disk`.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# scipy ships no py.typed marker, so it is an untyped-but-installed import.
# ignore_missing_imports does not cover that case; following the untyped module
# is preferable to adding scipy-stubs, whose fisher_exact signature rejects the
# nested lists scipy itself accepts.
[[tool.mypy.overrides]]
module = ["scipy.*"]
follow_untyped_imports = true

# xlsxwriter (the Compare view's XLSX export) ships no py.typed marker either.
[[tool.mypy.overrides]]
module = ["xlsxwriter.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "-m", "not network"]
markers = [
    "network: hits a live upstream; deselected by default, run with -m network",
]

[project.scripts]
genetrek = "genetrek.web:main"
genetrek-db = "genetrek.cli:main"
genetrek-validate-fields = "genetrek.validate_fields:main"
