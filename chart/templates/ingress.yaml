{{- if .Values.ingress.enabled }}
{{/*
Deliberately no annotations: they are controller-specific, and a plain Ingress
with a host and a path is all the application needs. Websockets need nothing
either, as long as the controller passes the upgrade at /_nicegui_ws/ through:
they must work. If an upgrade fails, socket.io falls back to long polling, and
that breaks rather than degrades -- NiceGUI's first message is larger than
engine.io's 1,000,000-byte maxPayload, so the page never loads.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "genetrek.fullname" . }}
  labels: {{- include "genetrek.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    # Must already exist in the namespace; nothing here creates it.
    - hosts:
        - {{ $.Values.ingress.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.goatcounter.enabled }}
          # The visit counter's count endpoint, and nothing else of it: the
          # dashboard has its own, network-restricted host. Same origin as the
          # pages, so the browser's report needs no CORS.
          - path: {{ .Values.goatcounter.basePath }}/count
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "genetrek.goatcounter.fullname" . }}
                port:
                  number: 8080
          {{- end }}
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "genetrek.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
