apiVersion: v1
kind: Service
metadata:
  name: {{ include "genetrek.fullname" . }}
  labels: {{- include "genetrek.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "genetrek.selectorLabels" . | nindent 4 }}
