# External links, generated by 'genetrek-db init'.
# Each entry appears in the per-gene dialog; {placeholder} is a column.
links:
  - name: "NCBI Gene"
    url: "https://www.ncbi.nlm.nih.gov/gene/{ncbi_id}"

  - name: "OMIM"
    url: "https://www.omim.org/entry/{omim_id}"

  - name: "HGNC"
    url: "https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/{hgnc_id}"

  - name: "Ensembl"
    url: "https://www.ensembl.org/Homo_sapiens/Gene/Summary?g={ensg}"

  - name: "GeneCards"
    url: "https://www.genecards.org/cgi-bin/carddisp.pl?gene={hgnc_symbol}"

  - name: "gnomAD"
    url: "https://gnomad.broadinstitute.org/gene/{ensg}?dataset=gnomad_r4"

  - name: "AGB"
    url: "https://agb.broadinstitute.org/gene/{hgnc_symbol}"

  - name: "SFARI"
    url: "https://gene.sfari.org/database/human-gene/{hgnc_symbol}"

  - name: "SysNDD"
    url: "https://sysndd.dbmr.unibe.ch/Genes/{hgnc_symbol}"

  - name: "GTEx"
    url: "https://gtexportal.org/home/gene/{hgnc_symbol}"

  - name: "Gene2Phenotype"
    url: "https://www.ebi.ac.uk/gene2phenotype/gene/{hgnc_symbol}"

  - name: "NDD GeneHub"
    url: "https://nddgenehub.org/gene/{hgnc_symbol}"

  - name: "DECIPHER"
    url: "https://www.deciphergenomics.org/gene/{hgnc_symbol}"

  - name: "Neurosynth"
    url: "https://neurosynth.org/genes/{hgnc_symbol}/"
