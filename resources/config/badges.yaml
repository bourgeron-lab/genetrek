# Badge rendering. Generated by notebooks/create_20260903.ipynb from the
# live badges.yaml plus the entries the 2026 inheritance vocabulary needs.
inheritance:
  Unknown:
    show: false
  Autosomal Dominant:
    label: AD
    color: '#0d6efd'
  Autosomal Recessive:
    label: AR
    color: '#198754'
  X-linked Dominant:
    label: XD
    color: '#6610f2'
  X-linked Recessive:
    label: XR
    color: '#20c997'
  MT:
    label: MT
    color: '#d63384'
  Somatic:
    label: Som
    color: '#fd7e14'
  Mitochondrial:
    label: MT
    color: '#d63384'
  X-linked other:
    label: XL
    color: '#6f42c1'
eagle_score:
  not applicable:
    show: false
  definitive:
    label: Def
    color: '#28a745'
  strong:
    label: Str
    color: '#17a2b8'
  moderate:
    label: Mod
    color: '#ffc107'
  limited:
    label: Lim
    color: '#fd7e14'

# Threshold colour scales for numeric columns. Red marks a constrained gene,
# blue an unconstrained one -- red/blue rather than red/green because red and
# green are the pair deuteranopia collapses, and these columns are read daily.
#
# Rules are tried in order and the first match wins; a rule with no bound is the
# fallback. The numbers restate the criteria behind `is_loeuf_gnomad_v4_1_1` and
# `is_shet_constrained`, which sit beside each score in the table -- if a future
# release moves a threshold, both places have to move.
loeuf:
  scale:
    - below: 0.45
      color: '#c53030'
    - color: '#2b6cb0'
shet_mean:
  scale:
    - above: 0.073
      color: '#c53030'
    - color: '#2b6cb0'
shet_lower:
  scale:
    - above: 0.021
      color: '#c53030'
    - color: '#2b6cb0'
