  description: "Prenatal log2FC >= 1 and Benjamini-Hochberg FDR < 0.05, testing prenatal against postnatal donors (Mann-Whitney, one value per donor: the mean over its regions of region-centred log2 RPKM). Prenatal = 8-23 post-conception weeks (15 donors), postnatal = birth to 40 years (22 donors), late fetal (24-37 pcw) excluded. False: measured, not prenatal-biased. Null: not in BrainSpan."
