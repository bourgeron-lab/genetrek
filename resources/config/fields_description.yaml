jiang2020_brain_ts:
  fullname: Brain protein TS (Jiang 2020)
  description: "Tissue-specificity (TS) score of the protein in brain, from the GTEx quantitative proteome (Jiang et al. 2020, Table S2): the higher of Brain Cortex and Brain Cerebellum. TS is a robust z-score of the protein's relative abundance in that tissue against its body-wide distribution (AdaTiSS), capped at +/-10; 2.5 is the paper's tissue-enriched threshold and 4 its tissue-specific one. 0 is average abundance, not absence. Null: not quantified in either brain tissue (scores seen in a single replicate count as not quantified, as in the paper). Measured for 8,911 genes."
  update: "20200917"
  visibility: secondary
  priority: null
  category: "Expression"
  subcategory: "Brain proteome"
  source: "Jiang et al. 2020, Cell 183:269 -- Table S2, sheet 'G protein TS score'"
  doi: "10.1016/j.cell.2020.08.036"
  licence: Not open (Elsevier open archive; non-commercial)
  universe: "Proteins with a TS score in Brain Cortex or Brain Cerebellum (Jiang et al. 2020, Table S2; TMT proteomics of 32 GTEx tissues)"
  value_type: float
  id_type: null
  assembly: ""
  primary_key: false
  added: "20261007"
  source_file: "jiang2020_mmc3_tableS2.xlsx"
  derived_op: null
