brainspan_prenatal_log2fc:
  fullname: Prenatal log2FC (BrainSpan)
  description: "Prenatal bias of brain expression in BrainSpan: log2 fold change of prenatal over postnatal expression (prenatal = 8-23 post-conception weeks (15 donors), postnatal = birth to 40 years (22 donors), late fetal (24-37 pcw) excluded), as the mean over 16 brain regions of the per-region difference in mean log2(RPKM + 1). Positive = higher before birth. 0 = no difference, including genes measured at 0 RPKM throughout. Null: not in BrainSpan. Measured for 37,197 genes."
