  aliases: []
jiang2020_brain_enriched:
  fullname: Brain-enriched protein (Jiang 2020)
  description: "The paper's own call: the protein is tissue-enriched in Brain Cortex or Brain Cerebellum (TS >= 2.5 with at least 3 quantified tissues; Table S4 category prt_specific or prt_enriched_not_spec). Not exclusive -- the protein may be enriched elsewhere too: 951 of the 1,783 source proteins are enriched in brain only, and 209 rest on the cerebellum alone. False: quantified in brain and not enriched there. Null: not quantified in brain."
  update: "20200917"
