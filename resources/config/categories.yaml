# Display order of the column categories, for the gene table and the column
# selector alike. List order *is* the order shown.
#
# Generated by notebooks/create_20260903.ipynb. Hand-maintained afterwards:
# 'genetrek-db init' carries this file over rather than regenerating it.
categories:
  - name: Gene identity
    description: HGNC nomenclature and cross-references to other databases
    subcategories:
      - Nomenclature
      - Cross-references
  - name: Coordinates
    description: Genomic position, GRCh38 and GRCh37
    subcategories:
      - GRCh38
      - GRCh37
  - name: NDD gene lists
    description: Neurodevelopmental disorder gene lists, by trait, each led by GeneTrek's own list
    subcategories:
      - GeneTrek
      - Autism
      - Epilepsy
      - IDD
      - Other
  - name: Other gene lists
    description: Curated disease and clinical gene lists outside NDD
    subcategories:
      - Cancer
      - Clinical
  - name: Function
    description: Molecular function and pathway membership
  - name: Constraint
    description: Selection and mutational constraint metrics
    subcategories:
      - gnomAD
      - s-het
      - Dosage sensitivity
  - name: Expression
    description: Brain expression and specificity, protein and RNA, adult and developing
    subcategories:
      - Brain proteome
      - Brain development
      - Adult tissues
  - name: Publications
    description: Per-publication measurements
  # Last, so the table ends with it -- only a visitor's own lists come after.
  - name: Inheritance
    description: Mode of inheritance
  - name: Other
    description: Columns not yet assigned a category
    uncategorized: true
